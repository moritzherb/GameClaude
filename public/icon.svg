<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- soft light from the top left, no hard edges -->
    <linearGradient id="face" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#d2fa4c"/>
      <stop offset="1" stop-color="#b9e62b"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93bd1c"/>
      <stop offset="1" stop-color="#7a9f12"/>
    </linearGradient>
    <radialGradient id="pip" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#23251e"/>
      <stop offset="1" stop-color="#0c0d0a"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#10110e"/>
  <!-- a lime die showing five, tilted like it was just thrown -->
  <g transform="rotate(-12 256 256)">
    <rect x="124" y="150" width="280" height="280" rx="60" fill="#000" opacity="0.5" filter="url(#shadow)"/>
    <rect x="116" y="128" width="280" height="280" rx="60" fill="url(#lip)"/>
    <rect x="116" y="112" width="280" height="280" rx="60" fill="url(#face)"/>
    <rect x="116" y="112" width="280" height="280" rx="60" fill="url(#shine)"/>
    <g fill="url(#pip)">
      <circle cx="180" cy="176" r="29"/>
      <circle cx="332" cy="176" r="29"/>
      <circle cx="256" cy="252" r="29"/>
      <circle cx="180" cy="328" r="29"/>
      <circle cx="332" cy="328" r="29"/>
    </g>
  </g>
</svg>
