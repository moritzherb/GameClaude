<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- One colour, the start-up screen's dark (it is dark in every look): an iPhone opening the app
         again, before the page is drawn, colours the strip under the clock with it. Once the app runs,
         lib/themeColor.ts sets it to what shows at the top. -->
    <meta name="theme-color" content="#20211c" />
    <!-- The page's very first picture (before its styles arrive, or reloading after an update) in the
         start-up screen's dark, never a white flash. -->
    <style>
      html {
        background: #20211c;
      }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: since iOS 27 that lays a frosted blur over the top of the page. With the
         default bar the page starts below the clock, and the bar takes the page's colour (see .top-edge
         in global.css). iOS reads this once, when the app is added to the home screen. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="prost!" />
    <meta name="description" content="Drinking games for parties and pregaming." />
    <!-- Icons carry a version (?v=) so phones fetch the new file instead of a cached old one. Bump it with every icon change. -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=5" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=5" />
    <link rel="manifest" href="./manifest.webmanifest?v=7" />
    <!-- Opening the app from cold (the iPhone had closed it in the background), the phone shows this
         until the page is drawn instead of a black screen: the start-up screen, one per screen size. -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1320x2868.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1206x2622.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1260x2736.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1290x2796.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1179x2556.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1284x2778.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1170x2532.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1242x2688.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash/iphone-828x1792.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1125x2436.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/iphone-1242x2208.png?v=4" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash/iphone-750x1334.png?v=4" />
    <title>prost!</title>
  </head>
  <body>
    <div class="top-edge" aria-hidden="true"></div>
    <!-- Starting up: a plain dark screen with the app's lime die turning (gone once the app is drawn, see main.tsx). -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: grid;
        place-items: center;
        background: #20211c;
        transition: opacity 0.3s ease;
      }
      #boot svg {
        width: 64px;
        height: 64px;
        animation: boot-spin 0.7s linear infinite;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation-duration: 2.4s;
        }
      }
    </style>
    <div id="boot" aria-hidden="true">
      <svg viewBox="100 96 312 328">
        <defs>
          <linearGradient id="boot-f" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#d2fa4c" /><stop offset="1" stop-color="#b9e62b" /></linearGradient>
          <linearGradient id="boot-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93bd1c" /><stop offset="1" stop-color="#7a9f12" /></linearGradient>
        </defs>
        <rect x="116" y="128" width="280" height="280" rx="60" fill="url(#boot-l)" />
        <rect x="116" y="112" width="280" height="280" rx="60" fill="url(#boot-f)" />
        <g fill="#14150f"><circle cx="180" cy="176" r="29" /><circle cx="332" cy="176" r="29" /><circle cx="256" cy="252" r="29" /><circle cx="180" cy="328" r="29" /><circle cx="332" cy="328" r="29" /></g>
      </svg>
    </div>
    <script>
      // When the start-up screen first showed (main.tsx keeps it up as long as a game's splash).
      window.__bootAt = performance.now();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
