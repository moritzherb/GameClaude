<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f1ede3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10110e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: since iOS 27 that lays a frosted blur over the top of the page. With the
         default bar the page starts below the clock, and the bar takes the page's colour (see .top-edge
         in global.css). iOS reads this once, when the app is added to the home screen. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="prost!" />
    <meta name="description" content="Drinking games for parties and pregaming." />
    <!-- Icons carry a version (?v=) so phones fetch the new file instead of a cached old one. Bump it with every icon change. -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=5" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=5" />
    <link rel="manifest" href="./manifest.webmanifest?v=5" />
    <title>prost!</title>
  </head>
  <body>
    <div class="top-edge" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
